name: contexts-lab
on:
  workflow_dispatch:
    inputs:
      release_kind:
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump github context
        env:
          GH_CTX: ${{ toJSON(github) }}
        run: echo "$GH_CTX" | jq '{event_name, ref, sha, actor, run_id, run_attempt}'
      - name: Set step output
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "ts=$(date -u +%FT%TZ)"      >> "$GITHUB_OUTPUT"
      - name: Mask a fake token
        run: |
          FAKE=$(openssl rand -hex 16)
          echo "::add-mask::$FAKE"
          echo "fake=$FAKE" >> "$GITHUB_ENV"
      - name: Group + annotations
        run: |
          echo "::group::env summary"
          env | sort | head -20
          echo "::endgroup::"
          echo "::notice file=workflows/03-contexts-lab.yml,line=1::release=${{ inputs.release_kind }} sha=${{ steps.meta.outputs.short_sha }}"